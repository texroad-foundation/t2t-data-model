    permissible_values:
      post_industrial:
        text: post_industrial
        description: Textile waste from manufacturing, before products reach the market.
        meaning: https://texroad-foundation.github.io/t2t-data-model/lists/material_source/post_industrial
        title: Post-industrial
      pre_consumer:
        text: pre_consumer
        description: Finished textile products that were never sold to consumers.
        meaning: https://texroad-foundation.github.io/t2t-data-model/lists/material_source/pre_consumer
        title: Pre-consumer
      post_consumer_residential:
        text: post_consumer_residential
        description: Textile waste discarded by individual households after consumer
          use.
