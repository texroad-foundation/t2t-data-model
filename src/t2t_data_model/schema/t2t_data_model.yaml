      other_animal_fibers:
        title: Other animal fibers
        meaning: https://texroad-foundation.github.io/t2t-data-model/lists/fiber_composition_name/other_animal_fibers
      other_cellulosic_fibers:
        title: Other cellulosic fibers
        meaning: https://texroad-foundation.github.io/t2t-data-model/lists/fiber_composition_name/other_cellulosic_fibers
      other:
        title: Other
        meaning: https://texroad-foundation.github.io/t2t-data-model/lists/fiber_composition_name/other
  FiberCompositionThreshold:
    title: Fiber Composition Threshold
    enum_uri: https://texroad-foundation.github.io/t2t-data-model/lists/fiber_composition_threshold
    permissible_values:
      minimum:
        title: Minimum
        meaning: https://texroad-foundation.github.io/t2t-data-model/lists/fiber_composition_threshold/minimum
      maximum:
        title: Maximum
        meaning: https://texroad-foundation.github.io/t2t-data-model/lists/fiber_composition_threshold/maximum
      amount_listed:
        title: Amount listed
        meaning: https://texroad-foundation.github.io/t2t-data-model/lists/fiber_composition_threshold/amount_listed
  ContaminantType:
    title: Contaminant Type
    enum_uri: https://texroad-foundation.github.io/t2t-data-model/lists/contaminant_type
    permissible_values:
      fibers:
        title: Fibers
        meaning: https://texroad-foundation.github.io/t2t-data-model/lists/contaminant_type/fibers
      coatings_and_finishes:
        title: Coatings and finishes
        meaning: https://texroad-foundation.github.io/t2t-data-model/lists/contaminant_type/coatings_and_finishes
      dyes_and_pigments:
        title: Dyes and pigments
